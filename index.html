<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>by YouSa | Luxury Modest Fashion</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="announcement-bar">
        ✨ ÚLTIMAS PIEZAS: ENVÍO GRATIS EN ESPAÑA ✨
    </div>

    <!-- Header -->
    <header class="site-header">
        <div class="container header-main">
            <a href="/" class="logo">by <span>YouSa.</span></a>

            <nav id="desktop-nav">
                <a href="#shop"
                    style="text-decoration:none; color:inherit; font-size:0.7rem; font-weight:700; text-transform:uppercase;">Colección</a>
                <a href="#shop"
                    style="text-decoration:none; color:inherit; font-size:0.7rem; font-weight:700; text-transform:uppercase;">Bestsellers</a>
            </nav>

            <div style="display:flex; align-items:center; gap:1rem;">
                <div class="watching-count" style="font-size:0.6rem; font-weight:700; color:#888;">🔥 42 COMPRANDO</div>
                <div onclick="toggleCart()" style="position:relative; cursor:pointer;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <path d="M16 10a4 4 0 0 1-8 0" />
                    </svg>
                    <span class="cart-count"
                        style="position:absolute; top:-5px; right:-8px; background:var(--color-secondary); color:#fff; font-size:8px; width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center;">0</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Hero -->
        <section class="hero">
            <img src="assets/hero_banner.png" class="hero-img">
            <div class="container hero-content">
                <div style="max-width:600px;">
                    <span
                        style="background:var(--color-accent); color:#000; padding:4px 10px; font-size:0.6rem; font-weight:800; text-transform:uppercase;">Edición
                        Limitada</span>
                    <h2 data-animate>Rediseñando la <span>Modestia.</span></h2>
                    <a href="#shop" class="btn btn-black btn-shine">Comprar Ahora</a>
                </div>
            </div>
        </section>

        <!-- Product Feed -->
        <section id="shop" class="container">
            <h2 style="padding: 2rem 0 1rem; font-size: 2rem;">La <span>Colección</span></h2>
            <div id="product-feed">
                <!-- Injected via JS -->
            </div>
        </section>
    </main>

    <!-- Mobile Bottom Tabs -->
    <nav class="mobile-tabs">
        <a href="/" class="tab-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Home
        </a>
        <a href="#shop" class="tab-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            Explorar
        </a>
        <a href="javascript:void(0)" class="tab-item" onclick="toggleCart()">
            <div style="position:relative;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                    <line x1="3" y1="6" x2="21" y2="6" />
                </svg>
                <span class="cart-count"
                    style="position:absolute; top:-5px; right:-8px; background:var(--color-secondary); color:#fff; font-size:8px; width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center;">0</span>
            </div>
            Bolsa
        </a>
    </nav>

    <!-- Cart Drawer -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div
            style="padding:1.5rem; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
            <h3>Tu Bolsa</h3>
            <button onclick="toggleCart()" style="background:none; border:none; font-size:1.5rem;">&times;</button>
        </div>
        <div id="cart-items" style="flex:1; overflow-y:auto; padding:1.5rem;"></div>
        <div style="padding:1.5rem; border-top:1px solid #eee; background:#f9f9f9;">
            <div style="display:flex; justify-content:space-between; margin-bottom:1rem; font-weight:700;">
                <span>Total</span>
                <span id="cart-total">0.00€</span>
            </div>
            <button class="btn btn-black" style="width:100%;" onclick="checkout()">Finalizar Pedido</button>
        </div>
    </div>

    <!-- Product Modal (Vertical Stack for Mobile) -->
    <div id="product-modal">
        <button id="close-modal-btn" onclick="closeProductModal()">&times;</button>
        <div class="modal-container">
            <div class="modal-image-side">
                <img id="modal-img" src="" style="width:100%; height:100%; object-fit:cover;">
            </div>
            <div class="modal-content-side">
                <h3 id="modal-title" style="font-size:2.5rem; margin-bottom:0.5rem;">Title</h3>
                <div id="modal-price"
                    style="font-size:1.5rem; color:var(--color-secondary); font-weight:700; margin-bottom:2rem;">0.00€
                </div>

                <p style="font-size:0.8rem; color:#666; margin-bottom:1.5rem;">Selecciona tu talla:</p>
                <div id="modal-sizes" style="margin-bottom:2rem;"></div>

                <div class="stock-bar">
                    <div class="stock-progress" id="modal-stock-progress"></div>
                </div>
                <p style="font-size:0.6rem; font-weight:700; color:#e74c3c; margin-top:5px;">⚠️ ÚLTIMAS UNIDADES
                    DISPONIBLES</p>

                <!-- Desktop ATC -->
                <button class="btn btn-black btn-shine" id="modal-atc-desktop" style="margin-top:2rem;"
                    onclick="addToCart()">Añadir a la Bolsa</button>
            </div>
        </div>
    </div>

    <!-- Mobile Sticky ATC Bar (REACHABLE) -->
    <div class="mobile-atc-bar" id="mobile-sticky-atc-container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-weight:700; font-size:0.9rem;" id="sticky-title-mobile">Title</div>
            <div style="font-weight:700;" id="sticky-price-mobile">0.00€</div>
        </div>
        <button class="btn btn-black btn-shine" style="width:100%;" onclick="addToCart()">Añadir a la Bolsa</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
